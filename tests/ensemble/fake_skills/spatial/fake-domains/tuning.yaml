schema_version: 1
skill: fake-domains
script: fake_domains.py
analysis: spatial_domains
method_flag: --method
output:
  kind: labels
  labels: {table: tables/domain_assignments.csv, id_column: observation, label_column: spatial_domain}
  h5ad: processed.h5ad
reference: {coords_obsm: spatial, expression_obsm: X_pca}
defaults:
  resources: {gpu: none, memory_gb: 2, cpus: 1, timeout_s: 60}
context:
  data_type: {type: categorical, flag: --data-type, choices: [visium, slide_seq], default: null}
methods:
  split:
    params:
      n: {type: int, flag: --n, low: 2, high: 6, default: 3, priority: 1}
      id_column: {type: categorical, flag: --id-column, choices: [observation, barcode], default: observation}
  gpu:
    resources: {gpu: preferred}
    params:
      n: {type: int, flag: --n, low: 2, high: 6, default: 3}
  needsgpu:
    resources: {gpu: required}
  fail:
    params:
      exit_code: {type: int, flag: --exit-code, low: 1, high: 5, default: 3}
  sleep:
    resources: {timeout_s: 2}
    params:
      seconds: {type: float, flag: --seconds, low: 0.1, high: 60.0, default: 30.0}
  eat:
    resources: {memory_gb: 0.3}
    params:
      memory_mb: {type: int, flag: --memory-mb, low: 50, high: 4000, default: 1000}
  nolabels: {}
  noresult: {}
  extra: {}
  cal:
    k_control: {kind: calibrate, param: resolution}
    params:
      resolution: {type: float, flag: --resolution, low: 0.1, high: 2.0, log: true, default: 1.0, priority: 1}
      smooth: {type: float, flag: --smooth, low: 0.0, high: 0.9, default: 0.3, priority: 2}
  twod:
    k_control: {kind: exact, param: n}
    params:
      n: {type: int, flag: --n, low: 2, high: 20, default: 7, priority: 1}
      alpha: {type: float, flag: --alpha, low: 0.1, high: 0.9, default: 0.5, priority: 2}
      beta: {type: int, flag: --beta, low: 50, high: 400, log: true, default: 100, priority: 3}
  grid1:
    k_control: {kind: exact, param: n}
    params:
      n: {type: int, flag: --n, low: 2, high: 20, default: 7, priority: 1}
      layers: {type: int, flag: --layers, low: 1, high: 5, default: 3, priority: 2}
  flaky:
    k_control: {kind: exact, param: n}
    params:
      n: {type: int, flag: --n, low: 2, high: 20, default: 7, priority: 1}
      fail_above: {type: int, flag: --fail-above, low: 0, high: 20, default: 0, priority: 2}
  rand:
    params:
      n: {type: int, flag: --n, low: 2, high: 20, default: 4}
