name: Eval CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The eval suite is hermetic: no provider key, no telemetry export.
env:
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  LLM_API_KEY: ""
  OTEL_ENABLED: "false"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      # fastapi is left out on purpose: with it installed,
      # tests/launch/test_surfaces.py starts a real server and hangs.
      # The desktop HTTP tests are therefore skipped in CI.
      - run: pip install -e . pytest numpy "pandas>=2.0,<3.0" scipy scikit-learn matplotlib seaborn networkx PyYAML requests "anndata==0.11.4" h5py rich nbformat
      # The framework layers only. Tests known to fail are listed in
      # tests/ci_known_failures.txt and run as strict xfail.
      - name: Run unit tests
        run: >-
          pytest
          tests/engine tests/entry tests/provider tests/tools tests/context
          tests/permission tests/hooks tests/memory tests/planning
          tests/observability tests/schema tests/skills tests/subagent
          tests/sandbox tests/skillenv tests/mcp tests/sdk tests/evals
          -m "not slow and not demo and not eval and not scripted_eval"
          -p no:cacheprovider

  eval:
    name: Scripted eval suite (gate)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e . pytest
      - name: Run the eval dataset
        run: pytest tests/evals/dataset -m scripted_eval -p no:cacheprovider
        env:
          OMICSCLAW_EVAL_REPORT_DIR: build/eval-report
      # Prints one line and exits 0 when pytest failed before writing a report.
      - name: Report eval summary
        if: always()
        run: python -m omicsclaw.evals.report summary build/eval-report/report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: build/eval-report/
          retention-days: 30
          if-no-files-found: warn
