requires_preprocessed: true
trigger_keywords:
  - hi-c
  - hic
  - 3c
  - chromosome-conformation
  - mapping
  - alignment
  - bwa-mem2
  - pairtools
  - pairs
  - ligation-junction
legacy_aliases:
  - bulkhic-alignment
